name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *" # daily, off the hour: refreshes feed even without a push
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout upstream catalog history
        uses: actions/checkout@v6
        with:
          repository: ikaijua/Awesome-AITools
          path: .upstream
          fetch-depth: 0 # the feed derives first-appearance dates from full history
      - name: Install Pillow and CJK fonts for OG cards
        run: |
          python3 -m pip install --quiet pillow
          if ! PYTHONPATH=scripts python3 -c 'import build_og; build_og.font(24, True); build_og.font(24, False)' 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
            PYTHONPATH=scripts python3 -c 'import build_og; build_og.font(24, True); build_og.font(24, False)'
          fi
      - name: Validate JavaScript and data
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --check site/app.js
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('site')
          data = json.loads((root / 'data.json').read_text())
          assert len(data['meta']['commit']) == 40
          assert data['meta']['repository'] == 'https://github.com/ikaijua/Awesome-AITools'
          assert data['meta']['updatedAt'] in data['meta']['committedAt']
          for language in ('zh', 'en'):
              assert data[language], f'Empty {language} directory'
              for tool in data[language]:
                  assert tool['name'] and tool['category'] and tool['links']
                  assert all(link['url'].startswith(('https://', 'http://')) for link in tool['links'])
                  assert not tool['more'] or tool['more'].startswith('https://github.com/ikaijua/Awesome-AITools/discussions/')
          assert all((root / asset).exists() for asset in ('index.html', 'style.css', 'app.js', 'data.json'))
          PY
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static bilingual pages
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build_site.py --base-url "$PAGES_BASE_URL"
      - name: Build new-entry feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/build_feed.py --upstream .upstream --outdir dist --limit 60 --site "$PAGES_BASE_URL"
          test -s dist/feed.xml && test -s dist/feed.json
      - name: Build OG share cards
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/build_og.py --base-url "$PAGES_BASE_URL"
          test "$(find dist/og -name '*.png' | wc -l)" -gt 100
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
